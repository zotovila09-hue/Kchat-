<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KChat • Мессенджер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .container{background:white;border-radius:16px;padding:20px;width:90%;max-width:500px;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
        h1{text-align:center;color:#667eea;margin-bottom:16px}
        input,button{padding:12px;border-radius:8px;font-size:16px;width:100%;margin:6px 0}
        input{border:1px solid #ddd}
        button{background:#667eea;color:white;border:none;cursor:pointer;font-weight:bold}
        button:hover{background:#5a6fd6}
        .msg{background:#f0f0f0;padding:8px 12px;border-radius:8px;margin:4px 0;word-break:break-word}
        .msg .sender{font-weight:bold;color:#667eea;font-size:12px}
        .msg .time{font-size:10px;color:#999;float:right}
        #messages{max-height:400px;overflow-y:auto;margin:12px 0;padding:8px;background:#fafafa;border-radius:8px}
        .tabs{display:flex;gap:4px;margin:8px 0}
        .tab{flex:1;padding:8px;text-align:center;background:#eee;border-radius:6px;cursor:pointer;font-size:14px}
        .tab.active{background:#667eea;color:white}
        #status{text-align:center;font-size:12px;color:#666;margin:4px 0}
        .online{color:#31a24c}
        .offline{color:#999}
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
        // ====== СЕРВЕР ======
        const SERVER_URL = 'https://kchat-j89m.onrender.com';
        let socket;
        let currentUser = null;
        let currentChat = 'general';
        let messages = { general: [] };
        let allUsers = [
            {phone:'+79001234567',name:'Александр',username:'alex',avatar:'😎',online:false},
            {phone:'+79161112233',name:'Мария',username:'maria',avatar:'👩',online:false},
            {phone:'+79262223344',name:'Дмитрий',username:'dima',avatar:'👨',online:false},
            {phone:'+79363334455',name:'Елена',username:'elena',avatar:'👩',online:false},
            {phone:'+79991112233',name:'Бот',username:'bot',avatar:'🤖',online:true}
        ];

        // ====== ПОДКЛЮЧЕНИЕ К СЕРВЕРУ ======
        function connectToServer() {
            try {
                socket = io(SERVER_URL);
                
                socket.on('connect', () => {
                    console.log('✅ Подключены к серверу!');
                    if (currentUser) {
                        socket.emit('register', {
                            phone: currentUser.phone,
                            name: currentUser.name,
                            username: currentUser.username,
                            avatar: currentUser.avatar
                        });
                    }
                });

                socket.on('users:update', (users) => {
                    if (users && users.length > 0) {
                        allUsers = users;
                    }
                });

                socket.on('message:general', (data) => {
                    console.log('🌍 Получено в общий чат:', data);
                    if (!messages['general']) messages['general'] = [];
                    messages['general'].push({
                        id: Date.now().toString(),
                        sender: data.fromPhone,
                        text: data.text,
                        time: data.time || Date.now(),
                        senderName: data.fromName || 'Пользователь',
                        senderUsername: data.fromUsername || 'user'
                    });
                    if (currentChat === 'general') renderMessages();
                });

                socket.on('message:private', (data) => {
                    console.log('📩 Получено личное:', data);
                    if (!messages[data.chatId]) messages[data.chatId] = [];
                    messages[data.chatId].push({
                        id: Date.now().toString(),
                        sender: data.fromPhone,
                        text: data.text,
                        time: data.time || Date.now(),
                        senderName: data.fromName || 'Пользователь',
                        senderUsername: data.fromUsername || 'user'
                    });
                    if (currentChat === data.chatId) renderMessages();
                });

                socket.on('user:searchResults', (results) => {
                    if (results && results.length > 0) {
                        allUsers = results;
                    }
                });

                socket.on('connect_error', () => {
                    console.log('⚠️ Сервер недоступен, работаем локально');
                });

            } catch(e) {
                console.log('⚠️ Сервер недоступен:', e.message);
            }
        }

        // ====== АВТОРИЗАЦИЯ ======
        function showAuth() {
            document.getElementById('app').innerHTML = `
                <h1>🚀 KChat</h1>
                <p style="text-align:center;color:#666;margin-bottom:12px">Мессенджер с поиском по @username</p>
                <input type="tel" id="phoneInput" placeholder="Номер телефона" value="+79001234567">
                <input type="text" id="codeInput" placeholder="Код подтверждения" value="12345" maxlength="5">
                <input type="text" id="nameInput" placeholder="Ваше имя" value="Александр">
                <input type="text" id="usernameInput" placeholder="@username" value="alex">
                <button onclick="login()">🚀 Войти / Зарегистрироваться</button>
                <p style="text-align:center;color:#999;font-size:12px;margin-top:8px">Демо-код: 12345. Готовые логины: alex, maria, dima, elena</p>
            `;
        }

        function login() {
            const phone = document.getElementById('phoneInput').value.trim();
            const code = document.getElementById('codeInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim();

            if (!phone || code !== '12345') return alert('Код: 12345');
            if (!name || !username) return alert('Заполните все поля');

            currentUser = {
                phone: phone,
                name: name,
                username: username,
                avatar: '😎',
                status: 'В сети'
            };

            // Сохраняем
            localStorage.setItem('kchat_user', JSON.stringify(currentUser));

            // Создаём чаты
            if (!messages['general']) messages['general'] = [];
            
            // Чат с ботом
            const botChatId = 'bot_chat';
            if (!messages[botChatId]) {
                messages[botChatId] = [{
                    id: 'welcome',
                    sender: '+79991112233',
                    text: `Привет, @${username}! Я бот. Используй поиск чтобы найти людей!`,
                    time: Date.now(),
                    senderName: '🤖 Бот',
                    senderUsername: 'bot'
                }];
            }

            connectToServer();
            
            // Регистрируем на сервере
            if (socket && socket.connected) {
                socket.emit('register', {
                    phone: currentUser.phone,
                    name: currentUser.name,
                    username: currentUser.username,
                    avatar: currentUser.avatar
                });
            }

            showChat();
        }

        // ====== ЧАТ ======
        function showChat() {
            if (!currentUser) {
                showAuth();
                return;
            }

            document.getElementById('app').innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                    <h2 style="margin:0">💬 KChat</h2>
                    <span style="font-size:14px">@${currentUser.username}</span>
                </div>
                <div id="status">Подключение...</div>
                <div class="tabs" id="tabs">
                    <div class="tab active" data-chat="general">🌍 Общий</div>
                    <div class="tab" data-chat="bot_chat">🤖 Бот</div>
                </div>
                <div id="chatTitle" style="font-weight:bold;margin:8px 0">🌍 Общий чат</div>
                <div id="messages"></div>
                <div style="display:flex;gap:8px">
                    <input type="text" id="msgInput" placeholder="Сообщение..." style="flex:1">
                    <button onclick="sendMessage()" style="width:auto;padding:12px 20px">➤</button>
                </div>
                <div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">
                    <button onclick="searchUsers()" style="width:auto;font-size:14px;padding:8px 12px;background:#31a24c">🔍 Поиск</button>
                    <button onclick="createGroup()" style="width:auto;font-size:14px;padding:8px 12px;background:#ff9f43">👥 Группа</button>
                    <button onclick="logout()" style="width:auto;font-size:14px;padding:8px 12px;background:#ff4444">🚪 Выйти</button>
                </div>
                <div id="extraChats" style="margin-top:8px"></div>
            `;

            // Статус подключения
            if (socket && socket.connected) {
                document.getElementById('status').innerHTML = '<span class="online">🟢 Сервер подключен</span>';
            } else {
                document.getElementById('status').innerHTML = '<span class="offline">⚫ Локальный режим</span>';
            }

            // Вкладки
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentChat = tab.dataset.chat;
                    updateChatTitle();
                    renderMessages();
                });
            });

            // Enter для отправки
            document.getElementById('msgInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            updateChatTitle();
            renderMessages();
            renderExtraChats();
            
            // Обновляем статус
            if (socket) {
                socket.on('connect', () => {
                    document.getElementById('status').innerHTML = '<span class="online">🟢 Сервер подключен</span>';
                });
                socket.on('disconnect', () => {
                    document.getElementById('status').innerHTML = '<span class="offline">⚫ Локальный режим</span>';
                });
            }
        }

        function updateChatTitle() {
            const titles = {
                'general': '🌍 Общий чат (все пользователи)',
                'bot_chat': '🤖 Чат с ботом'
            };
            const title = titles[currentChat] || 'Чат';
            document.getElementById('chatTitle').textContent = title;
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const msg = {
                id: Date.now().toString(),
                sender: currentUser.phone,
                text: text,
                time: Date.now(),
                senderName: currentUser.name,
                senderUsername: currentUser.username
            };

            if (!messages[currentChat]) messages[currentChat] = [];
            messages[currentChat].push(msg);
            renderMessages();
            input.value = '';

            // Отправка через сервер
            if (socket && socket.connected) {
                if (currentChat === 'general') {
                    socket.emit('message:general', {
                        text: text,
                        fromPhone: currentUser.phone,
                        fromName: currentUser.name,
                        fromUsername: currentUser.username
                    });
                } else {
                    // Личное сообщение
                    const otherPhone = currentChat === 'bot_chat' ? '+79991112233' : null;
                    if (otherPhone) {
                        socket.emit('message:send', {
                            to: otherPhone,
                            chatId: currentChat,
                            text: text,
                            fromPhone: currentUser.phone,
                            fromName: currentUser.name,
                            fromUsername: currentUser.username
                        });
                    }
                }
            }

            // Ответ бота
            if (currentChat === 'bot_chat') {
                setTimeout(() => {
                    const replies = ['👍', 'Интересно!', 'Понял', 'Ищи людей через поиск 🔍', 'Общий чат доступен!'];
                    const botMsg = {
                        id: Date.now().toString(),
                        sender: '+79991112233',
                        text: replies[Math.floor(Math.random() * replies.length)],
                        time: Date.now(),
                        senderName: '🤖 Бот',
                        senderUsername: 'bot'
                    };
                    messages[currentChat].push(botMsg);
                    renderMessages();
                }, 1000);
            }
        }

        function renderMessages() {
            const container = document.getElementById('messages');
            if (!container) return;

            const msgs = messages[currentChat] || [];
            
            if (msgs.length === 0) {
                container.innerHTML = '<p style="color:#999;text-align:center;padding:20px">Нет сообщений. Напишите первое!</p>';
                return;
            }

            container.innerHTML = msgs.map(m => {
                const isMe = m.sender === currentUser.phone;
                return `<div class="msg" style="background:${isMe?'#667eea':'#f0f0f0'};color:${isMe?'white':'black'}">
                    <div class="sender" style="color:${isMe?'rgba(255,255,255,0.8)':'#667eea'}">${isMe?'Я':(m.senderName||'Пользователь')} @${m.senderUsername||'user'}</div>
                    ${m.text}
                    <div class="time">${new Date(m.time).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</div>
                </div>`;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        function renderExtraChats() {
            const container = document.getElementById('extraChats');
            if (!container) return;

            // Показываем другие чаты
            const otherChats = Object.keys(messages).filter(id => 
                id !== 'general' && id !== 'bot_chat' && id !== currentChat
            );

            if (otherChats.length === 0) {
                container.innerHTML = '<p style="color:#999;font-size:12px">Нет других чатов. Используйте поиск!</p>';
                return;
            }

            container.innerHTML = '<p style="font-weight:bold;margin-top:8px">Другие чаты:</p>' + 
                otherChats.map(id => {
                    const u = allUsers.find(u => id.includes(u.phone));
                    return `<button onclick="openChat('${id}')" style="width:auto;font-size:12px;padding:6px 10px;margin:2px">💬 ${u?.name||'Чат'}</button>`;
                }).join('');
        }

        function openChat(chatId) {
            currentChat = chatId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            updateChatTitle();
            renderMessages();
            renderExtraChats();
        }

        // ====== ПОИСК ======
        function searchUsers() {
            const query = prompt('🔍 Введите @username для поиска:\n(maria, alex, dima, elena, bot)');
            if (!query) return;

            const q = query.toLowerCase().replace('@', '');
            const found = allUsers.filter(u => 
                u.phone !== currentUser.phone && 
                (u.username?.toLowerCase().includes(q) || u.name?.toLowerCase().includes(q))
            );

            if (found.length === 0) {
                alert('❌ Никого не найдено. Попробуйте: maria, alex, dima, elena, bot');
                return;
            }

            const list = found.map((u, i) => `${i+1}. ${u.name} (@${u.username}) ${u.online?'🟢':'⚫'}`).join('\n');
            const choice = prompt(`Найдено:\n${list}\n\nВведите номер чтобы создать чат:`);
            
            if (choice && found[parseInt(choice)-1]) {
                const user = found[parseInt(choice)-1];
                startChat(user.phone, user.name, user.username);
            }
        }

        function startChat(phone, name, username) {
            const chatId = 'chat_' + [currentUser.phone, phone].sort().join('_');
            
            if (messages[chatId]) {
                alert('Чат уже существует!');
                currentChat = chatId;
                showChat();
                return;
            }

            messages[chatId] = [{
                id: Date.now().toString(),
                sender: currentUser.phone,
                text: `👋 Привет, @${username}! Давай общаться!`,
                time: Date.now(),
                senderName: currentUser.name,
                senderUsername: currentUser.username
            }];

            currentChat = chatId;
            showChat();
            updateChatTitle();
            renderMessages();
        }

        function createGroup() {
            const name = prompt('Название группы:');
            if (!name) return;
            
            const members = prompt('Введите @username участников через запятую:\n(например: maria, dima)');
            if (!members) return;

            const chatId = 'group_' + Date.now();
            messages[chatId] = [{
                id: Date.now().toString(),
                sender: currentUser.phone,
                text: `🎉 Группа "${name}" создана!`,
                time: Date.now(),
                senderName: currentUser.name,
                senderUsername: currentUser.username
            }];

            currentChat = chatId;
            showChat();
        }

        function logout() {
            if (confirm('Выйти?')) {
                currentUser = null;
                currentChat = 'general';
                localStorage.removeItem('kchat_user');
                showAuth();
            }
        }

        // ====== ЗАПУСК ======
        connectToServer();

        // Проверяем сохранённого пользователя
        const saved = localStorage.getItem('kchat_user');
        if (saved) {
            try {
                currentUser = JSON.parse(saved);
                showChat();
            } catch(e) {
                showAuth();
            }
        } else {
            showAuth();
        }

        console.log('✅ KChat готов!');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KChat • Работает 100%</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
        #app{background:white;border-radius:20px;width:100%;max-width:500px;min-height:600px;box-shadow:0 20px 40px rgba(0,0,0,0.3);overflow:hidden;display:flex;flex-direction:column}
        .header{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:15px;text-align:center;font-weight:bold;font-size:18px}
        .content{flex:1;display:flex;flex-direction:column;padding:15px;overflow:hidden}
        #messages{flex:1;overflow-y:auto;margin-bottom:10px;padding:5px}
        .msg{margin:5px 0;padding:8px 12px;border-radius:10px;max-width:80%;word-break:break-word;font-size:14px}
        .msg.mine{background:#667eea;color:white;margin-left:auto}
        .msg.other{background:#f0f0f0;color:#333}
        .msg .name{font-size:11px;font-weight:bold;margin-bottom:2px;opacity:0.8}
        .msg .time{font-size:10px;opacity:0.6;text-align:right;margin-top:3px}
        .input-row{display:flex;gap:8px}
        .input-row input{flex:1;padding:12px;border:2px solid #ddd;border-radius:25px;font-size:16px;outline:none}
        .input-row input:focus{border-color:#667eea}
        .input-row button{width:50px;height:50px;border-radius:50%;border:none;background:#667eea;color:white;font-size:20px;cursor:pointer}
        .input-row button:hover{background:#5a6fd6}
        .btn-row{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
        .btn-row button{padding:8px 12px;border:none;border-radius:20px;font-size:12px;cursor:pointer;font-weight:bold}
        .btn-search{background:#31a24c;color:white}
        .btn-contacts{background:#ff9f43;color:white}
        .btn-settings{background:#8b5cf6;color:white}
        .btn-logout{background:#ff4444;color:white}
        #status{text-align:center;font-size:11px;margin:5px 0}
        .online{color:#31a24c}.offline{color:#999}
        .tabs{display:flex;gap:3px;margin:8px 0;flex-wrap:wrap}
        .tab{padding:6px 12px;border-radius:15px;background:#eee;font-size:12px;cursor:pointer;border:none}
        .tab.active{background:#667eea;color:white}
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ====== КОНФИГ ======
        const SERVER_URL = 'https://kchat-j89m.onrender.com';
        let socket = null;
        let user = null;
        let currentChat = 'general';
        let messages = { general: [] };
        let chats = [];
        let allUsers = [
            {phone:'+79161112233',name:'Мария',username:'maria',avatar:'👩',online:true},
            {phone:'+79262223344',name:'Дмитрий',username:'dima',avatar:'👨',online:false},
            {phone:'+79363334455',name:'Елена',username:'elena',avatar:'👩',online:true},
            {phone:'+79991112233',name:'Бот',username:'bot',avatar:'🤖',online:true}
        ];

        // ====== СОХРАНЕНИЕ ======
        function save() {
            localStorage.setItem('kchat_user', JSON.stringify(user));
            localStorage.setItem('kchat_msgs', JSON.stringify(messages));
            localStorage.setItem('kchat_chats', JSON.stringify(chats));
        }

        function load() {
            try {
                const u = localStorage.getItem('kchat_user');
                const m = localStorage.getItem('kchat_msgs');
                const c = localStorage.getItem('kchat_chats');
                if (u) user = JSON.parse(u);
                if (m) messages = JSON.parse(m);
                if (c) chats = JSON.parse(c);
            } catch(e) {}
            if (!messages['general']) messages['general'] = [];
            if (!chats.find(c => c.id === 'general')) {
                chats.unshift({ id: 'general', type: 'group', name: 'Общий чат', avatar: '🌍', participants: [], isGeneral: true });
            }
        }

        // ====== ПОДКЛЮЧЕНИЕ ======
        function connect() {
            try {
                socket = io(SERVER_URL, { transports: ['websocket', 'polling'], timeout: 10000 });
                
                socket.on('connect', () => {
                    console.log('✅ Подключены!');
                    updateStatus(true);
                    if (user) {
                        socket.emit('register', { phone: user.phone, name: user.name, username: user.username, avatar: user.avatar });
                    }
                });

                socket.on('disconnect', () => updateStatus(false));
                socket.on('connect_error', () => updateStatus(false));

                socket.on('users:update', (users) => {
                    if (users && users.length > 0) allUsers = users;
                });

                socket.on('message:general', (data) => {
                    if (!messages['general']) messages['general'] = [];
                    messages['general'].push({
                        id: Date.now().toString(),
                        sender: data.fromPhone,
                        text: data.text,
                        time: data.time || Date.now(),
                        senderName: data.fromName || 'Пользователь',
                        senderUsername: data.fromUsername || 'user'
                    });
                    save();
                    if (currentChat === 'general') renderMessages();
                });

                socket.on('message:private', (data) => {
                    const chatId = data.chatId;
                    if (!messages[chatId]) messages[chatId] = [];
                    messages[chatId].push({
                        id: Date.now().toString(),
                        sender: data.fromPhone,
                        text: data.text,
                        time: data.time || Date.now(),
                        senderName: data.fromName || 'Пользователь',
                        senderUsername: data.fromUsername || 'user'
                    });
                    save();
                    if (currentChat === chatId) renderMessages();
                });

            } catch(e) {
                console.log('Сервер недоступен:', e.message);
                updateStatus(false);
            }
        }

        function updateStatus(ok) {
            const el = document.getElementById('status');
            if (el) el.innerHTML = ok ? '<span class="online">🟢 Сервер подключен</span>' : '<span class="offline">⚫ Локальный режим</span>';
        }

        // ====== ОТОБРАЖЕНИЕ ======
        function showAuth() {
            document.getElementById('app').innerHTML = `
                <div class="header">🚀 KChat</div>
                <div class="content" style="justify-content:center">
                    <h3 style="text-align:center;color:#667eea;margin-bottom:15px">Вход в мессенджер</h3>
                    <input type="tel" id="phoneInput" placeholder="Номер телефона" value="+79001234567" style="padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px;margin:5px 0">
                    <input type="text" id="codeInput" placeholder="Код (12345) или пароль" value="12345" style="padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px;margin:5px 0">
                    <input type="text" id="nameInput" placeholder="Ваше имя" value="Александр" style="padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px;margin:5px 0">
                    <input type="text" id="usernameInput" placeholder="@username" value="alex" style="padding:12px;border:2px solid #ddd;border-radius:10px;font-size:16px;margin:5px 0">
                    <button onclick="doLogin()" style="padding:12px;background:#667eea;color:white;border:none;border-radius:10px;font-size:16px;margin:8px 0;cursor:pointer;font-weight:bold">🚀 Войти</button>
                    <p style="text-align:center;color:#999;font-size:11px">Код: 12345 | Готовые: alex, maria, dima, elena</p>
                </div>`;
        }

        function doLogin() {
            const phone = document.getElementById('phoneInput').value.trim();
            const code = document.getElementById('codeInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim();

            if (!phone) return alert('Введите номер');
            if (code !== '12345' && code !== (user?.password || '1234')) return alert('Неверный код/пароль');
            if (!name || !username) return alert('Заполните поля');

            user = { phone, name, username, avatar: '😎', status: 'В сети', password: '1234' };
            save();
            connect();
            if (socket && socket.connected) {
                socket.emit('register', { phone, name, username, avatar: '😎' });
            }
            showMain();
        }

        function showMain() {
            if (!user) { showAuth(); return; }
            
            document.getElementById('app').innerHTML = `
                <div class="header">💬 KChat | @${user.username}</div>
                <div class="content">
                    <div id="status">Подключение...</div>
                    <div class="tabs" id="tabs">
                        <button class="tab active" onclick="switchChat('general')">🌍 Общий</button>
                    </div>
                    <div id="messages"></div>
                    <div class="input-row">
                        <input type="text" id="msgInput" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter')sendMsg()">
                        <button onclick="sendMsg()">➤</button>
                    </div>
                    <div class="btn-row">
                        <button class="btn-search" onclick="searchUsers()">🔍 Поиск</button>
                        <button class="btn-contacts" onclick="showContacts()">👥 Контакты</button>
                        <button class="btn-settings" onclick="showSettings()">⚙️</button>
                        <button class="btn-logout" onclick="logout()">🚪</button>
                    </div>
                </div>`;

            updateStatus(socket && socket.connected);
            renderTabs();
            renderMessages();
            document.getElementById('msgInput')?.focus();
        }

        function renderTabs() {
            const container = document.getElementById('tabs');
            if (!container) return;
            
            // Добавляем бота
            if (!document.getElementById('tab_bot')) {
                const b = document.createElement('button');
                b.className = 'tab';
                b.id = 'tab_bot';
                b.textContent = '🤖 Бот';
                b.onclick = () => switchChat('bot');
                container.appendChild(b);
            }

            // Добавляем личные чаты
            const personal = chats.filter(c => c.type === 'private' && c.id !== 'bot');
            personal.forEach(chat => {
                const otherPhone = chat.participants.find(p => p !== user.phone);
                const otherUser = allUsers.find(u => u.phone === otherPhone) || { name: 'Контакт' };
                const tabId = 'tab_' + chat.id;
                if (!document.getElementById(tabId)) {
                    const t = document.createElement('button');
                    t.className = 'tab';
                    t.id = tabId;
                    t.textContent = '💬 ' + otherUser.name.split(' ')[0];
                    t.onclick = () => switchChat(chat.id);
                    container.appendChild(t);
                }
            });
        }

        function switchChat(chatId) {
            currentChat = chatId;
            
            // Создаём чат если нужно
            if (chatId === 'bot' && !messages['bot']) {
                messages['bot'] = [{ id: Date.now().toString(), sender: '+79991112233', text: 'Привет! Я бот. Используй поиск!', time: Date.now(), senderName: '🤖 Бот', senderUsername: 'bot' }];
                if (!chats.find(c => c.id === 'bot')) {
                    chats.push({ id: 'bot', type: 'private', participants: [user.phone, '+79991112233'] });
                }
                save();
            }

            // Обновляем вкладки
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const activeTab = document.getElementById('tab_' + chatId) || document.querySelector(`[onclick="switchChat('${chatId}')"]`);
            if (activeTab) activeTab.classList.add('active');
            
            renderMessages();
        }

        function sendMsg() {
            const inp = document.getElementById('msgInput');
            const text = inp.value.trim();
            if (!text || !user) return;

            const msg = {
                id: Date.now().toString(),
                sender: user.phone,
                text: text,
                time: Date.now(),
                senderName: user.name,
                senderUsername: user.username
            };

            // Создаём чат если нужно
            if (!messages[currentChat]) {
                messages[currentChat] = [];
                if (currentChat === 'bot') {
                    chats.push({ id: 'bot', type: 'private', participants: [user.phone, '+79991112233'] });
                }
            }
            messages[currentChat].push(msg);
            renderMessages();
            inp.value = '';
            save();

            // Отправка через сервер
            if (socket && socket.connected) {
                if (currentChat === 'general') {
                    socket.emit('message:general', {
                        text: text,
                        fromPhone: user.phone,
                        fromName: user.name,
                        fromUsername: user.username
                    });
                } else {
                    const chat = chats.find(c => c.id === currentChat);
                    if (chat) {
                        const other = chat.participants.find(p => p !== user.phone);
                        if (other) {
                            socket.emit('message:send', {
                                to: other,
                                chatId: currentChat,
                                text: text,
                                fromPhone: user.phone,
                                fromName: user.name,
                                fromUsername: user.username
                            });
                        }
                    }
                }
            }

            // Автоответ бота
            if (currentChat === 'bot') {
                setTimeout(() => {
                    const replies = ['👍', 'Интересно!', 'Понял', 'Используй поиск 🔍'];
                    messages['bot'].push({
                        id: Date.now().toString(),
                        sender: '+79991112233',
                        text: replies[Math.floor(Math.random() * replies.length)],
                        time: Date.now(),
                        senderName: '🤖 Бот',
                        senderUsername: 'bot'
                    });
                    save();
                    renderMessages();
                }, 1000);
            }
        }

        function renderMessages() {
            const container = document.getElementById('messages');
            if (!container) return;
            
            const msgs = messages[currentChat] || [];
            
            if (msgs.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#999;padding:20px">Нет сообщений. Напишите первое!</p>';
                return;
            }

            container.innerHTML = msgs.map(m => {
                const isMine = m.sender === user.phone;
                return `<div class="msg ${isMine ? 'mine' : 'other'}">
                    <div class="name">${isMine ? 'Я' : (m.senderName || 'Пользователь')} @${m.senderUsername || ''}</div>
                    ${m.text}
                    <div class="time">${new Date(m.time).toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'})}</div>
                </div>`;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        // ====== ПОИСК ======
        function searchUsers() {
            const available = allUsers.filter(u => u.phone !== user.phone);
            const list = available.map((u, i) => `${i+1}. ${u.name} @${u.username} ${u.online?'🟢':'⚫'}`).join('\n');
            const choice = prompt('🔍 Найденные пользователи:\n\n' + list + '\n\nВведите номер чтобы начать чат:');
            if (choice && available[parseInt(choice)-1]) {
                startChat(available[parseInt(choice)-1].phone);
            }
        }

        function showContacts() {
            const available = allUsers.filter(u => u.phone !== user.phone);
            let html = '';
            available.forEach(u => {
                const has = chats.some(c => c.type === 'private' && c.participants.includes(u.phone));
                html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;margin:3px 0;background:#f9f9f9;border-radius:8px">
                    <span>${u.avatar} <b>${u.name}</b> @${u.username} ${u.online?'🟢':'⚫'}</span>
                    <button onclick="startChat('${u.phone}');document.querySelector('.modal-overlay')?.remove()" style="padding:5px 10px;background:#667eea;color:white;border:none;border-radius:15px;font-size:12px">${has?'💬':'➕'}</button>
                </div>`;
            });
            
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center';
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div style="background:white;padding:20px;border-radius:15px;width:90%;max-width:400px;max-height:70vh;overflow-y:auto">
                <h3>👥 Контакты</h3>${html}
                <button onclick="this.parentElement.parentElement.remove()" style="margin-top:10px;width:100%;padding:10px;background:#667eea;color:white;border:none;border-radius:10px">Закрыть</button>
            </div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }

        function startChat(phone) {
            const chatId = 'chat_' + [user.phone, phone].sort().join('_');
            if (chats.some(c => c.id === chatId)) {
                currentChat = chatId;
                showMain();
                return;
            }
            const u = allUsers.find(x => x.phone === phone) || { name: 'Контакт', username: 'user' };
            chats.push({ id: chatId, type: 'private', participants: [user.phone, phone] });
            messages[chatId] = [{ id: Date.now().toString(), sender: user.phone, text: `👋 Привет, @${u.username}!`, time: Date.now(), senderName: user.name, senderUsername: user.username }];
            currentChat = chatId;
            save();
            showMain();
        }

        function showSettings() {
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center';
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `<div style="background:white;padding:20px;border-radius:15px;width:90%;max-width:400px">
                <h3>⚙️ Настройки</h3>
                <p>Пользователь: <b>@${user.username}</b></p>
                <p>Телефон: ${user.phone}</p>
                <p>Пароль: ${user.password || '1234'}</p>
                <p>Чатов: ${chats.length}</p>
                <p>Сообщений в общем чате: ${(messages['general']||[]).length}</p>
                <button onclick="this.parentElement.parentElement.remove()" style="margin-top:10px;width:100%;padding:10px;background:#667eea;color:white;border:none;border-radius:10px">Закрыть</button>
            </div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }

        function logout() {
            if (confirm('Выйти?')) {
                user = null;
                currentChat = 'general';
                localStorage.removeItem('kchat_user');
                showAuth();
            }
        }

        // ====== ЗАПУСК ======
        load();
        connect();
        
        if (user) {
            showMain();
        } else {
            showAuth();
        }

        console.log('✅ KChat готов!');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KChat Pro • Полная версия</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
        :root{--bg:#fff;--bg2:#f0f2f5;--bg3:#f7f9fc;--text:#1a1a1a;--text2:#65676b;--blue:#0084ff;--green:#31a24c;--red:#ff4444;--orange:#ff9f43;--purple:#8b5cf6;--bubble-in:#e4e6eb;--bubble-out:#0084ff;--border:#dadde1;--t:0.3s cubic-bezier(0.4,0,0.2,1)}
        body.dark{--bg:#1a1a1a;--bg2:#0a0a0a;--bg3:#2a2a2a;--text:#e4e6eb;--text2:#b0b3b8;--bubble-in:#3a3b3c;--border:#3e4042}
        body{width:100vw;height:100vh;overflow:hidden;background:var(--bg2);color:var(--text);font-size:15px;-webkit-tap-highlight-color:transparent}
        #app{width:100%;height:100%;display:flex}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes scaleIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
        @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

        .auth-screen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:16px;animation:fadeIn 0.5s}
        .auth-card{background:var(--bg);border-radius:24px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 16px 40px rgba(0,0,0,0.25);animation:scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1);max-height:90vh;overflow-y:auto}
        .auth-card h1{text-align:center;font-size:2.2rem;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
        .input-group{margin-bottom:10px}
        .input-group label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:4px;color:var(--text2)}
        .input-group input,.input-group select{width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:12px;font-size:1rem;background:var(--bg3);color:var(--text);outline:none;transition:all var(--t)}
        .input-group input:focus,.input-group select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,132,255,0.1)}
        .btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all var(--t);margin-top:8px}
        .btn:active{transform:scale(0.97)}
        .btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:white;box-shadow:0 4px 12px rgba(102,126,234,0.3)}
        .btn-primary:hover{transform:translateY(-2px)}
        .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}
        .btn-danger{background:var(--red);color:white}
        .btn-sm{padding:8px 14px;width:auto;font-size:0.85rem;border-radius:10px}
        .btn-xs{padding:5px 10px;width:auto;font-size:0.75rem;border-radius:8px}

        .main-layout{display:flex;width:100%;height:100%;animation:fadeIn 0.4s}
        .sidebar{width:380px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
        .sidebar-header{padding:14px;border-bottom:1px solid var(--border)}
        .profile-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px;border-radius:14px;cursor:pointer;transition:all var(--t)}
        .profile-bar:hover{background:var(--bg3)}
        .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:white;flex-shrink:0}
        .profile-info{flex:1}
        .profile-name{font-weight:700;font-size:1rem}
        .profile-username{font-size:0.8rem;color:var(--blue)}
        .action-btns{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
        .action-btn{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:10px;background:var(--bg3);color:var(--text);cursor:pointer;font-size:0.82rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;transition:all var(--t)}
        .action-btn:hover{background:var(--blue);color:white}
        .chat-list{flex:1;overflow-y:auto;padding:6px}
        .chat-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;cursor:pointer;transition:all var(--t);margin-bottom:3px;animation:slideUp 0.3s ease backwards}
        .chat-item:hover{background:var(--bg3);transform:translateX(3px)}
        .chat-item.active{background:var(--blue);color:white}
        .chat-item-info{flex:1;min-width:0}
        .chat-item-name{font-weight:600;font-size:0.95rem}
        .chat-item-msg{font-size:0.82rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-item.active .chat-item-msg{color:rgba(255,255,255,0.8)}
        .unread-badge{background:var(--blue);color:white;border-radius:10px;padding:2px 7px;font-size:0.7rem;font-weight:700;margin-left:4px}
        .online-count{padding:8px 12px;border-top:1px solid var(--border);font-size:0.8rem;color:var(--text2)}

        .chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg2)}
        .chat-header{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
        .chat-title{flex:1;font-weight:700;font-size:1rem}
        .chat-subtitle{font-size:0.78rem;color:var(--text2)}
        .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--bg3);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all var(--t)}
        .icon-btn:hover{background:var(--blue);color:white}
        .icon-btn.danger:hover{background:var(--red)}
        .messages-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
        .msg{display:flex;max-width:72%;animation:msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1)}
        .msg.in{align-self:flex-start}
        .msg.out{align-self:flex-end}
        .msg-bubble{padding:10px 14px;border-radius:20px;word-break:break-word;font-size:0.95rem}
        .msg.in .msg-bubble{background:var(--bubble-in);color:var(--text);border-bottom-left-radius:6px}
        .msg.out .msg-bubble{background:var(--bubble-out);color:white;border-bottom-right-radius:6px}
        .msg-sender{font-size:0.7rem;margin-bottom:2px;color:var(--blue);font-weight:700}
        .msg-time{font-size:0.65rem;opacity:0.7;margin-top:4px;text-align:right}
        .input-bar{padding:12px 16px;background:var(--bg);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
        .input-bar input{flex:1;padding:11px 15px;border:2px solid var(--border);border-radius:24px;font-size:1rem;background:var(--bg3);color:var(--text);outline:none}
        .input-bar input:focus{border-color:var(--blue)}
        .empty-state{text-align:center;padding:50px 20px;color:var(--text2)}
        .empty-state i{font-size:3.5rem;opacity:0.2;margin-bottom:12px}

        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;animation:fadeIn 0.2s}
        .modal{background:var(--bg);border-radius:20px;padding:22px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,0.2);animation:scaleIn 0.3s cubic-bezier(0.34,1.56,0.64,1)}
        .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
        .modal-header h3{font-size:1.15rem}
        .modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg3);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all var(--t)}
        .modal-close:hover{background:var(--red);color:white;transform:rotate(90deg)}
        .setting-row{display:flex;align-items:center;justify-content:space-between;padding:13px 8px;border-bottom:1px solid var(--border);transition:all var(--t)}
        .setting-row:hover{background:var(--bg3);border-radius:8px}
        .setting-label{display:flex;align-items:center;gap:10px;font-size:0.95rem}
        .setting-label i{width:22px;color:var(--blue);text-align:center}
        .switch{position:relative;width:48px;height:26px}
        .switch input{opacity:0;width:0;height:0}
        .switch .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:26px;transition:0.3s}
        .switch .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:white;border-radius:50%;transition:0.3s}
        .switch input:checked+.slider{background:var(--blue)}
        .switch input:checked+.slider:before{transform:translateX(22px)}
        .tab-nav{display:flex;gap:4px;padding:4px;background:var(--bg3);border-radius:12px;margin-bottom:15px}
        .tab-btn{flex:1;padding:10px 6px;border:none;background:transparent;color:var(--text2);font-weight:600;cursor:pointer;border-radius:10px;font-size:0.82rem;transition:all var(--t)}
        .tab-btn.active{background:var(--bg);color:var(--blue)}
        .tab-content{display:none;animation:slideUp 0.3s}
        .tab-content.active{display:block}
        .user-list-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;cursor:pointer;transition:all var(--t)}
        .user-list-item:hover{background:var(--bg3)}
        .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--bg);border-radius:12px;padding:13px 20px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:2000;border-left:4px solid var(--blue);font-size:0.9rem;animation:slideUp 0.3s}
        .toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}

        @media(max-width:768px){.sidebar{width:100%;position:fixed;left:-100%;top:0;height:100%;z-index:100;transition:left var(--t)}.sidebar.open{left:0}.msg{max-width:85%}}
        @media(min-width:769px){.toast{left:auto;right:16px;transform:none}}
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        (function(){
            const SERVER_URL='https://kchat-j89m.onrender.com';
            const DEMO_CODE='12345';
            let socket;
            const state={user:null,allUsers:[],chats:[],messages:{},currentChat:null,theme:'light',onlineUsers:[],settings:{notifications:true,sound:true,privacy:{lastSeen:true,readReceipts:true},appearance:{fontSize:'medium'}},blacklist:[]};

            function save(){localStorage.setItem('kchat_pro_state',JSON.stringify(state))}
            function toast(msg,type='info'){const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
            function genId(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
            function fTime(ts){const d=new Date(ts);if(d.toDateString()===new Date().toDateString())return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('ru',{day:'2-digit',month:'2-digit'})}
            function closeModals(){document.querySelectorAll('.modal-overlay').forEach(m=>m.remove())}

            function connectServer(){
                try{socket=io(SERVER_URL);socket.on('connect',()=>{if(state.user)registerOnServer()});socket.on('users:update',users=>{state.allUsers=users;state.onlineUsers=users.filter(u=>u.online);updateOnlineCount()});
                socket.on('message:general',data=>{if(!state.messages['general'])state.messages['general']=[];state.messages['general'].push({id:genId(),sender:data.fromPhone,text:data.text,time:data.time||Date.now(),senderName:data.fromName,senderUsername:data.fromUsername});save();if(state.currentChat==='general')renderMessages();renderChatList()});
                socket.on('message:private',data=>{if(!state.messages[data.chatId])state.messages[data.chatId]=[];state.messages[data.chatId].push({id:genId(),sender:data.fromPhone,text:data.text,time:data.time||Date.now(),senderName:data.fromName,senderUsername:data.fromUsername});const c=state.chats.find(x=>x.id===data.chatId);if(c&&state.user)c.unread[state.user.phone]=(c.unread[state.user.phone]||0)+1;save();if(state.currentChat===data.chatId)renderMessages();renderChatList()});
                socket.on('disconnect',()=>updateOnlineCount())}catch(e){console.log('Сервер недоступен')}
            }

            function registerOnServer(){if(socket&&socket.connected&&state.user)socket.emit('register',{phone:state.user.phone,name:state.user.name,username:state.user.username,avatar:state.user.avatar,password:state.user.password})}
            function updateOnlineCount(){const el=document.getElementById('onlineCount');if(el)el.textContent=`🟢 Онлайн: ${state.onlineUsers.length}`}
            function applySettings(){document.body.style.fontSize=state.settings.appearance.fontSize==='small'?'13px':state.settings.appearance.fontSize==='large'?'17px':'15px'}

            function init(){
                // Автоматический вход
                const savedUser=localStorage.getItem('kchat_user');
                if(savedUser){try{state.user=JSON.parse(savedUser)}catch(e){}}
                const savedState=localStorage.getItem('kchat_pro_state');
                if(savedState){try{const d=JSON.parse(savedState);state.chats=d.chats||[];state.messages=d.messages||{};state.theme=d.theme||'light';state.settings=d.settings||state.settings;state.blacklist=d.blacklist||[]}catch(e){}}
                if(!state.messages['general'])state.messages['general']=[];
                if(!state.chats.find(c=>c.id==='general'))state.chats.unshift({id:'general',type:'group',name:'🌍 Общий чат',avatar:'🌍',participants:[],unread:{},pinned:true,isGeneral:true});
                if(state.user&&!state.chats.find(c=>c.id==='bot_'+state.user.phone)){state.chats.push({id:'bot_'+state.user.phone,type:'private',participants:[state.user.phone,'+79991112233'],unread:{},pinned:false});state.messages['bot_'+state.user.phone]=[{id:genId(),sender:'+79991112233',text:`С возвращением, @${state.user.username}! Используй поиск!`,time:Date.now(),senderName:'🤖 Бот',senderUsername:'bot'}]}
                if(state.theme==='dark')document.body.classList.add('dark');
                applySettings();connectServer();render();
            }

            function render(){document.getElementById('app').innerHTML=state.user?renderMain():renderAuth();if(state.user){attachMain();renderChatList();updateOnlineCount();if(state.currentChat)openChat(state.currentChat)}else{attachAuth()}}

            function renderAuth(){
                return `<div class="auth-screen"><div class="auth-card"><h1>KChat Pro</h1><p style="text-align:center;color:var(--text2);margin-bottom:16px">Поиск • Общий чат • Настройки</p>
                <div class="input-group"><label>📱 Номер телефона</label><input type="tel" id="phoneInput" value="+79001234567"></div>
                <div class="input-group"><label>🔐 Код (12345) или пароль</label><input type="text" id="codeInput" value="12345" maxlength="10"></div>
                <div class="input-group"><label>👤 Имя</label><input type="text" id="nameInput" value="Александр"></div>
                <div class="input-group"><label>@ Username</label><input type="text" id="usernameInput" value="alex" autocapitalize="none"></div>
                <div class="input-group"><label>🔑 Пароль (для входа без кода)</label><input type="password" id="passwordInput" value="1234" placeholder="Придумайте пароль"></div>
                <button class="btn btn-primary" id="loginBtn">🚀 Войти</button>
                <p style="text-align:center;color:var(--text2);font-size:0.8rem;margin-top:8px">Код: 12345 | Готовые: alex, maria, dima, elena | Пароль: 1234</p></div></div>`;
            }

            function attachAuth(){
                document.getElementById('loginBtn')?.addEventListener('click',()=>{
                    const phone=document.getElementById('phoneInput').value.trim();
                    const code=document.getElementById('codeInput').value.trim();
                    const name=document.getElementById('nameInput').value.trim();
                    const username=document.getElementById('usernameInput').value.trim();
                    const password=document.getElementById('passwordInput').value.trim();
                    if(!phone)return toast('Введите номер','error');
                    if(code!==DEMO_CODE&&code!==password&&code!=='1234')return toast('Неверный код/пароль','error');
                    if(!name||!username)return toast('Заполните все поля','error');
                    state.user={phone,name,username,avatar:'😎',status:'В сети',password:password||'1234'};
                    localStorage.setItem('kchat_user',JSON.stringify(state.user));
                    if(!state.chats.find(c=>c.id==='bot_'+phone)){state.chats.push({id:'bot_'+phone,type:'private',participants:[phone,'+79991112233'],unread:{},pinned:false});state.messages['bot_'+phone]=[{id:genId(),sender:'+79991112233',text:`Привет, @${username}! 🔍 Поиск, 🌍 Общий чат, ⚙️ Настройки!`,time:Date.now(),senderName:'🤖 Бот',senderUsername:'bot'}]}
                    save();registerOnServer();render();toast(`Добро пожаловать, @${username}!`,'success');
                });
            }

            function renderMain(){
                const u=state.user;
                return `<div class="main-layout">
                    <div class="sidebar" id="sidebar"><div class="sidebar-header">
                        <div class="profile-bar" id="profileBar"><div class="avatar">${u.avatar}</div><div class="profile-info"><div class="profile-name">${u.name}</div><div class="profile-username">@${u.username}</div></div></div>
                        <div class="action-btns"><button class="action-btn" id="searchBtn"><i class="fas fa-search"></i> Поиск</button><button class="action-btn" id="contactsBtn"><i class="fas fa-users"></i> Контакты</button><button class="action-btn" id="createGroupBtn"><i class="fas fa-plus"></i> Группа</button></div>
                    </div><div class="chat-list" id="chatList"></div><div class="online-count" id="onlineCount">🟢 Онлайн: ${state.onlineUsers.length}</div></div>
                    <div class="chat-area"><div class="chat-header">
                        <button class="icon-btn" id="menuBtn" style="display:none;"><i class="fas fa-bars"></i></button>
                        <div class="avatar" id="chatAvatar" style="width:36px;height:36px;font-size:1rem;">💬</div>
                        <div style="flex:1;"><div class="chat-title" id="chatName">Выберите чат</div><div class="chat-subtitle" id="chatStatus"></div></div>
                        <button class="icon-btn" id="pinBtn"><i class="fas fa-thumbtack"></i></button>
                        <button class="icon-btn danger" id="deleteChatBtn"><i class="fas fa-trash-alt"></i></button>
                        <button class="icon-btn" id="themeBtn"><i class="fas ${state.theme==='dark'?'fa-sun':'fa-moon'}"></i></button>
                        <button class="icon-btn" id="settingsBtn"><i class="fas fa-cog"></i></button>
                        <button class="icon-btn danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
                    </div><div class="messages-area" id="messagesArea"><div class="empty-state"><i class="fas fa-comments"></i><p>Выберите чат</p></div></div>
                    <div class="input-bar"><input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off"><button class="icon-btn" id="sendBtn" style="background:var(--blue);color:white;"><i class="fas fa-paper-plane"></i></button></div></div></div>`;
            }

            function attachMain(){
                document.getElementById('menuBtn')?.addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
                document.getElementById('profileBar')?.addEventListener('click',()=>{toast(`@${state.user.username} | Пароль: ${state.user.password}`,'info')});
                document.getElementById('searchBtn')?.addEventListener('click',showSearchModal);
                document.getElementById('contactsBtn')?.addEventListener('click',showContactsModal);
                document.getElementById('createGroupBtn')?.addEventListener('click',()=>{const name=prompt('Название группы:');if(name){const cid='grp_'+genId();state.chats.push({id:cid,type:'group',name,avatar:'👥',participants:[state.user.phone],admin:state.user.phone,unread:{},pinned:false});state.messages[cid]=[];state.currentChat=cid;save();render();toast(`Группа "${name}" создана!`,'success')}});
                document.getElementById('pinBtn')?.addEventListener('click',()=>{if(!state.currentChat)return;const c=state.chats.find(x=>x.id===state.currentChat);if(c){c.pinned=!c.pinned;save();renderChatList();toast(c.pinned?'📌 Закреплён':'Откреплён','success')}});
                document.getElementById('deleteChatBtn')?.addEventListener('click',()=>{if(!state.currentChat||state.currentChat==='general')return;if(confirm('Удалить чат?')){state.chats=state.chats.filter(c=>c.id!==state.currentChat);delete state.messages[state.currentChat];state.currentChat=null;save();render();toast('Чат удалён','success')}});
                document.getElementById('themeBtn')?.addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';document.body.classList.toggle('dark');document.getElementById('themeBtn').innerHTML=`<i class="fas ${state.theme==='dark'?'fa-sun':'fa-moon'}"></i>`;save()});
                document.getElementById('settingsBtn')?.addEventListener('click',showSettingsModal);
                document.getElementById('logoutBtn')?.addEventListener('click',()=>{if(confirm('Выйти?')){state.user=null;state.currentChat=null;localStorage.removeItem('kchat_user');save();render();toast('Вы вышли','info')}});

                const send=()=>{
                    const inp=document.getElementById('msgInput'),text=inp.value.trim();
                    if(!text||!state.currentChat)return;
                    const chat=state.chats.find(c=>c.id===state.currentChat);if(!chat)return;
                    const msg={id:genId(),sender:state.user.phone,text,time:Date.now(),senderName:state.user.name,senderUsername:state.user.username};
                    if(!state.messages[chat.id])state.messages[chat.id]=[];
                    state.messages[chat.id].push(msg);save();renderMessages();renderChatList();inp.value='';
                    // ОТПРАВКА ЧЕРЕЗ СЕРВЕР
                    if(socket&&socket.connected){
                        if(chat.isGeneral)socket.emit('message:general',{text,fromPhone:state.user.phone,fromName:state.user.name,fromUsername:state.user.username});
                        else if(chat.type==='private'){const o=chat.participants.find(p=>p!==state.user.phone);if(o)socket.emit('message:send',{to:o,chatId:chat.id,text,fromPhone:state.user.phone,fromName:state.user.name,fromUsername:state.user.username})}
                        else if(chat.type==='group'){chat.participants.forEach(p=>{if(p!==state.user.phone)socket.emit('message:send',{to:p,chatId:chat.id,text,fromPhone:state.user.phone,fromName:state.user.name,fromUsername:state.user.username})})}
                    }
                    if(chat.participants&&chat.participants.includes('+79991112233')){setTimeout(()=>{state.messages[chat.id].push({id:genId(),sender:'+79991112233',text:['👍','Интересно!','Понял','Ищи через поиск 🔍'][Math.floor(Math.random()*4)],time:Date.now(),senderName:'🤖 Бот',senderUsername:'bot'});save();if(state.currentChat===chat.id)renderMessages();renderChatList()},1000)}
                };
                document.getElementById('sendBtn')?.addEventListener('click',send);
                document.getElementById('msgInput')?.addEventListener('keypress',e=>{if(e.key==='Enter')send()});
                if(window.innerWidth<=768)document.getElementById('menuBtn').style.display='flex';
            }

            function showSearchModal(){
                const overlay=document.createElement('div');overlay.className='modal-overlay';
                const users=state.allUsers.length>0?state.allUsers:[{phone:'+79161112233',name:'Мария',username:'maria',avatar:'👩',online:true},{phone:'+79262223344',name:'Дмитрий',username:'dima',avatar:'👨',online:false},{phone:'+79363334455',name:'Елена',username:'elena',avatar:'👩',online:true},{phone:'+79991112233',name:'🤖 Бот',username:'bot',avatar:'🤖',online:true}];
                const available=users.filter(u=>u.phone!==state.user.phone);
                overlay.innerHTML=`<div class="modal"><div class="modal-header"><h3>🔍 Поиск людей</h3><button class="modal-close" id="mc">✕</button></div><div class="input-group"><input type="text" id="searchInput" placeholder="Введите @username" autofocus></div><p style="font-size:0.8rem;color:var(--text2);">Попробуйте: maria, dima, elena, bot</p><div id="results">${available.map(u=>`<div class="user-list-item" data-phone="${u.phone}"><div class="avatar" style="width:44px;height:44px;font-size:1.3rem;">${u.avatar}</div><div style="flex:1;"><div style="font-weight:600;">${u.name}</div><div style="color:var(--blue);">@${u.username}</div></div><span>${u.online?'🟢':'⚫'}</span></div>`).join('')}</div></div>`;
                document.body.appendChild(overlay);const close=()=>overlay.remove();
                overlay.querySelector('#mc').addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
                const input=overlay.querySelector('#searchInput');input.focus();
                const filterResults=()=>{const q=input.value.toLowerCase().replace('@','');const res=overlay.querySelector('#results');const found=available.filter(u=>u.username?.toLowerCase().includes(q)||u.name?.toLowerCase().includes(q));res.innerHTML=found.length?found.map(u=>`<div class="user-list-item" data-phone="${u.phone}"><div class="avatar" style="width:44px;height:44px;font-size:1.3rem;">${u.avatar}</div><div style="flex:1;"><div style="font-weight:600;">${u.name}</div><div style="color:var(--blue);">@${u.username}</div></div><span>${u.online?'🟢':'⚫'}</span></div>`).join(''):'<p style="text-align:center;padding:16px;color:var(--text2);">Никого не найдено. Попробуйте: maria, dima, elena, bot</p>';res.querySelectorAll('.user-list-item').forEach(item=>{item.addEventListener('click',function(){startChat(this.dataset.phone);close()})})};
                input.addEventListener('input',filterResults);
                overlay.querySelectorAll('#results .user-list-item').forEach(item=>{item.addEventListener('click',function(){startChat(this.dataset.phone);close()})});
            }

            function showContactsModal(){
                const overlay=document.createElement('div');overlay.className='modal-overlay';
                const users=state.allUsers.length>0?state.allUsers:[{phone:'+79161112233',name:'Мария',username:'maria',avatar:'👩',online:true},{phone:'+79262223344',name:'Дмитрий',username:'dima',avatar:'👨',online:false}];
                const available=users.filter(u=>u.phone!==state.user.phone);
                overlay.innerHTML=`<div class="modal"><div class="modal-header"><h3>👥 Контакты</h3><button class="modal-close" id="mc2">✕</button></div>${available.map(u=>`<div class="user-list-item" data-phone="${u.phone}"><div class="avatar" style="width:44px;height:44px;font-size:1.3rem;">${u.avatar}</div><div style="flex:1;"><div style="font-weight:600;">${u.name}</div><div style="color:var(--blue);">@${u.username}</div></div><span>${u.online?'🟢':'⚫'}</span></div>`).join('')}</div>`;
                document.body.appendChild(overlay);const close=()=>overlay.remove();
                overlay.querySelector('#mc2').addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
                overlay.querySelectorAll('.user-list-item').forEach(item=>{item.addEventListener('click',function(){startChat(this.dataset.phone);close()})});
            }

            function startChat(phone){
                const chatId='chat_'+[state.user.phone,phone].sort().join('_');
                if(state.chats.some(c=>c.id===chatId)){state.currentChat=chatId;render();return}
                const other=state.allUsers.find(u=>u.phone===phone)||{name:'Контакт',username:'user'};
                state.chats.push({id:chatId,type:'private',participants:[state.user.phone,phone],unread:{},pinned:false});
                state.messages[chatId]=[{id:genId(),sender:state.user.phone,text:`👋 Привет, @${other.username}!`,time:Date.now(),senderName:state.user.name,senderUsername:state.user.username}];
                state.currentChat=chatId;save();render();toast(`Чат с @${other.username} создан!`,'success');
            }

            function showSettingsModal(){
                const content=`<div class="tab-nav">
                    <button class="tab-btn active" data-tab="notif">🔔 Уведомления</button>
                    <button class="tab-btn" data-tab="privacy">🔒 Приватность</button>
                    <button class="tab-btn" data-tab="appear">🎨 Оформление</button>
                    <button class="tab-btn" data-tab="profile">👤 Профиль</button>
                    <button class="tab-btn" data-tab="block">🚫 ЧС</button>
                </div>
                <div id="tabNotif" class="tab-content active">
                    <div class="setting-row"><span class="setting-label"><i class="fas fa-bell"></i>Уведомления</span><label class="switch"><input type="checkbox" ${state.settings.notifications?'checked':''} id="sNotif"><span class="slider"></span></label></div>
                    <div class="setting-row"><span class="setting-label"><i class="fas fa-volume-up"></i>Звук</span><label class="switch"><input type="checkbox" ${state.settings.sound?'checked':''} id="sSound"><span class="slider"></span></label></div>
                </div>
                <div id="tabPrivacy" class="tab-content" style="display:none;">
                    <div class="setting-row"><span class="setting-label"><i class="fas fa-clock"></i>Время входа</span><label class="switch"><input type="checkbox" ${state.settings.privacy.lastSeen?'checked':''} id="sLastSeen"><span class="slider"></span></label></div>
                    <div class="setting-row"><span class="setting-label"><i class="fas fa-check-double"></i>Отчёты</span><label class="switch"><input type="checkbox" ${state.settings.privacy.readReceipts?'checked':''} id="sRead"><span class="slider"></span></label></div>
                </div>
                <div id="tabAppear" class="tab-content" style="display:none;">
                    <div class="setting-row"><span class="setting-label"><i class="fas fa-text-height"></i>Шрифт</span><select id="sFont" style="padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);"><option value="small" ${state.settings.appearance.fontSize==='small'?'selected':''}>Маленький</option><option value="medium" ${state.settings.appearance.fontSize==='medium'?'selected':''}>Средний</option><option value="large" ${state.settings.appearance.fontSize==='large'?'selected':''}>Большой</option></select></div>
                </div>
                <div id="tabProfile" class="tab-content" style="display:none;">
                    <div class="input-group"><label>Имя</label><input type="text" id="eName" value="${state.user.name}"></div>
                    <div class="input-group"><label>Username</label><input type="text" id="eUsername" value="${state.user.username}"></div>
                    <div class="input-group"><label>Пароль</label><input type="password" id="ePass" value="${state.user.password||'1234'}"></div>
                    <div class="input-group"><label>Статус</label><input type="text" id="eStatus" value="${state.user.status||'В сети'}"></div>
                    <button class="btn btn-primary btn-sm" id="saveProfileBtn"><i class="fas fa-save"></i>Сохранить профиль</button>
                </div>
                <div id="tabBlock" class="tab-content" style="display:none;">
                    ${state.blacklist.length===0?'<p style="text-align:center;padding:16px;color:var(--text2);">Список пуст</p>':state.blacklist.map(p=>{const u=state.allUsers.find(x=>x.phone===p);return`<div class="user-list-item"><div class="avatar" style="width:34px;height:34px;font-size:1rem;">${u?.avatar||'🚫'}</div><div style="flex:1;">${u?.name||p}</div><button class="btn btn-xs btn-outline" data-unblock="${p}">Разблок</button></div>`}).join('')}
                    <div class="input-group" style="margin-top:12px;"><input type="text" id="blockInput" placeholder="Введите @username"></div>
                    <button class="btn btn-danger btn-sm" id="blockBtn"><i class="fas fa-ban"></i>Заблокировать</button>
                </div>
                <button class="btn btn-primary" style="margin-top:14px;" id="saveSettingsBtn"><i class="fas fa-save"></i>Сохранить все</button>`;
                const{overlay,closeModal}=showModal('⚙️ Настройки',content,true);
                overlay.querySelectorAll('.tab-btn').forEach(btn=>{btn.addEventListener('click',()=>{overlay.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');overlay.querySelectorAll('.tab-content').forEach(t=>t.style.display='none');const tid='tab'+btn.dataset.tab.charAt(0).toUpperCase()+btn.dataset.tab.slice(1);const tab=overlay.querySelector('#'+tid);if(tab)tab.style.display='block'})});
                overlay.querySelectorAll('[data-unblock]').forEach(btn=>{btn.addEventListener('click',()=>{state.blacklist=state.blacklist.filter(p=>p!==btn.dataset.unblock);save();closeModal();showSettingsModal()})});
                overlay.querySelector('#blockBtn')?.addEventListener('click',()=>{const inp=overlay.querySelector('#blockInput').value.trim().replace('@','');const found=state.allUsers.find(u=>u.username===inp);if(!found)return toast('Не найден','error');if(!state.blacklist.includes(found.phone)){state.blacklist.push(found.phone);save();closeModal();showSettingsModal()}});
                overlay.querySelector('#saveProfileBtn')?.addEventListener('click',()=>{state.user.name=overlay.querySelector('#eName').value.trim();state.user.username=overlay.querySelector('#eUsername').value.trim();state.user.password=overlay.querySelector('#ePass').value.trim();state.user.status=overlay.querySelector('#eStatus').value.trim();localStorage.setItem('kchat_user',JSON.stringify(state.user));save();registerOnServer();closeModal();render();toast('Профиль обновлён!','success')});
                overlay.querySelector('#saveSettingsBtn').addEventListener('click',()=>{state.settings.notifications=overlay.querySelector('#sNotif')?.checked??true;state.settings.sound=overlay.querySelector('#sSound')?.checked??true;state.settings.privacy.lastSeen=overlay.querySelector('#sLastSeen')?.checked??true;state.settings.privacy.readReceipts=overlay.querySelector('#sRead')?.checked??true;state.settings.appearance.fontSize=overlay.querySelector('#sFont')?.value||'medium';save();applySettings();closeModal();toast('Настройки сохранены!','success')});
            }

            function showModal(title,content,wide=false){closeModals();const overlay=document.createElement('div');overlay.className='modal-overlay';overlay.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="modal-header"><h3>${title}</h3><button class="modal-close" id="modalCloseBtn">✕</button></div><div>${content}</div></div>`;document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.querySelector('#modalCloseBtn').addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc)}});return{overlay,closeModal:close}}

            function renderChatList(){
                const ctr=document.getElementById('chatList');if(!ctr||!state.user)return;const up=state.user.phone;
                let chats=state.chats.filter(c=>c.participants.includes(up)||c.isGeneral||c.id==='bot_'+up);
                chats.sort((a,b)=>{if(a.pinned&&!b.pinned)return-1;if(!a.pinned&&b.pinned)return 1;const la=(state.messages[a.id]||[]).slice(-1)[0];const lb=(state.messages[b.id]||[]).slice(-1)[0];return(lb?.time||0)-(la?.time||0)});
                ctr.innerHTML=chats.map((c,i)=>{let n,av;if(c.isGeneral){n='🌍 Общий чат';av='🌍'}else if(c.id==='bot_'+up){n='🤖 Бот';av='🤖'}else if(c.type==='private'){const o=c.participants.find(p=>p!==up);const u=state.allUsers.find(x=>x.phone===o)||{name:'Контакт',avatar:'👤'};n=u.name;av=u.avatar}else{n=c.name||'Группа';av=c.avatar||'👥'}const msgs=(state.messages[c.id]||[]).slice(-1)[0];return`<div class="chat-item ${c.id===state.currentChat?'active':''} ${c.pinned?'pinned':''}" data-chat="${c.id}" style="animation-delay:${i*0.03}s"><div class="avatar" style="width:44px;height:44px;font-size:1.3rem;">${av}</div><div class="chat-item-info"><div style="display:flex;justify-content:space-between;"><span class="chat-item-name">${c.pinned?'📌 ':''}${n}</span><span style="font-size:0.65rem;color:var(--text2);">${msgs?fTime(msgs.time):''}</span></div><div class="chat-item-msg">${msgs?msgs.text.substring(0,25):'Нет сообщений'}${c.unread&&c.unread[up]?`<span class="unread-badge">${c.unread[up]}</span>`:''}</div></div></div>`}).join('');
                ctr.querySelectorAll('.chat-item').forEach(i=>i.addEventListener('click',()=>openChat(i.dataset.chat)));
            }

            function openChat(chatId){state.currentChat=chatId;const chat=state.chats.find(c=>c.id===chatId);if(!chat||!state.user)return;if(chat.unread)chat.unread[state.user.phone]=0;let n,av;if(chat.isGeneral){n='🌍 Общий чат';av='🌍'}else if(chatId==='bot_'+state.user.phone){n='🤖 Бот';av='🤖'}else if(chat.type==='private'){const o=chat.participants.find(p=>p!==state.user.phone);const u=state.allUsers.find(x=>x.phone===o)||{name:'Контакт',avatar:'👤'};n=u.name;av=u.avatar}else{n=chat.name||'Группа';av=chat.avatar||'👥'}document.getElementById('chatAvatar').textContent=av;document.getElementById('chatName').textContent=n;document.getElementById('chatStatus').textContent=chat.isGeneral?`${state.onlineUsers.length} онлайн`:'';renderMessages();renderChatList();save();if(window.innerWidth<=768)document.getElementById('sidebar').classList.remove('open')}

            function renderMessages(){const ctr=document.getElementById('messagesArea');if(!ctr||!state.currentChat)return;const msgs=(state.messages[state.currentChat]||[]).filter(m=>!m.deleted);if(!msgs.length){ctr.innerHTML='<div class="empty-state"><i class="fas fa-comment-slash"></i><p>Нет сообщений</p></div>';return}ctr.innerHTML=msgs.map(m=>{const isMe=m.sender===state.user.phone;return`<div class="msg ${isMe?'out':'in'}"><div class="msg-bubble">${!isMe?`<div class="msg-sender">${m.senderName||'Пользователь'} @${m.senderUsername||''}</div>`:''}${m.text}<div class="msg-time">${fTime(m.time)}${isMe?' ✓':''}</div></div></div>`}).join('');setTimeout(()=>ctr.scrollTop=ctr.scrollHeight,50)}

            init();
            console.log('🔥 KChat Pro | Авто-вход + Пароль + Настройки + Поиск | ГОТОВ!');
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KChat Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 10px; }
        input { padding: 10px; width: 70%; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; background: #0084ff; color: white; border: none; }
        .msg { padding: 8px; margin: 4px 0; background: #f0f0f0; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🧪 KChat Тест</h1>
    <p id="status">Подключение...</p>
    <input type="text" id="msgInput" placeholder="Введите сообщение">
    <button onclick="sendMsg()">Отправить</button>
    <h3>Сообщения:</h3>
    <div id="messages"></div>

    <script>
        const SERVER_URL = 'https://kchat-j89m.onrender.com';
        let socket;
        
        try {
            socket = io(SERVER_URL);
            document.getElementById('status').textContent = '🟡 Подключаюсь...';
            
            socket.on('connect', () => {
                document.getElementById('status').textContent = '🟢 Подключено! Можно общаться.';
                socket.emit('register', {
                    phone: prompt('Введите номер:', '+79001234567') || '+79001234567',
                    name: prompt('Имя:', 'Тест') || 'Тест',
                    username: prompt('Username:', 'test') || 'test',
                    avatar: '😎'
                });
            });
            
            socket.on('message:general', (data) => {
                addMessage(`${data.fromName} (@${data.fromUsername}): ${data.text}`, false);
            });
            
            socket.on('message:private', (data) => {
                addMessage(`📩 ${data.fromName}: ${data.text}`, false);
            });
            
            socket.on('connect_error', () => {
                document.getElementById('status').textContent = '🔴 Ошибка подключения';
            });
        } catch(e) {
            document.getElementById('status').textContent = '🔴 Ошибка: ' + e.message;
        }
        
        function addMessage(text, isMe) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.style.background = isMe ? '#0084ff' : '#f0f0f0';
            div.style.color = isMe ? 'white' : 'black';
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
        }
        
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            
            if (socket && socket.connected) {
                socket.emit('message:general', {
                    text: text,
                    fromPhone: '+79001234567',
                    fromName: 'Тест',
                    fromUsername: 'test'
                });
                addMessage('Я: ' + text, true);
                input.value = '';
            } else {
                alert('Сервер не подключен!');
            }
        }
        
        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>

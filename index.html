<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KChat • Рабочий</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .container{background:white;border-radius:16px;padding:20px;width:90%;max-width:500px;box-shadow:0 4px 16px rgba(0,0,0,0.1)}
        h1{text-align:center;color:#667eea;margin-bottom:12px}
        input,button{padding:12px;border-radius:8px;font-size:16px;width:100%;margin:6px 0}
        input{border:1px solid #ddd}
        button{background:#667eea;color:white;border:none;cursor:pointer;font-weight:bold}
        button:hover{background:#5a6fd6}
        button.green{background:#31a24c}
        button.orange{background:#ff9f43}
        button.red{background:#ff4444}
        .msg{background:#f0f0f0;padding:8px 12px;border-radius:8px;margin:4px 0;word-break:break-word}
        .msg .sender{font-weight:bold;color:#667eea;font-size:12px}
        .msg .time{font-size:10px;color:#999;float:right}
        #messages{max-height:350px;overflow-y:auto;margin:12px 0;padding:8px;background:#fafafa;border-radius:8px}
        .tabs{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
        .tab{flex:1;min-width:60px;padding:8px;text-align:center;background:#eee;border-radius:6px;cursor:pointer;font-size:12px}
        .tab.active{background:#667eea;color:white}
        #status{text-align:center;font-size:12px;margin:4px 0}
        .online{color:#31a24c}.offline{color:#999}
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
        const SERVER_URL = 'https://kchat-j89m.onrender.com';
        let socket;
        let currentUser = null;
        let currentChat = 'general';
        let messages = {};
        let allUsers = [];
        let chats = [];
        let settings = {notifications:true, sound:true, fontSize:'medium'};

        // ====== ПОДКЛЮЧЕНИЕ ======
        function connectServer() {
            try {
                socket = io(SERVER_URL);
                socket.on('connect', () => {
                    updateStatus(true);
                    if (currentUser) registerOnServer();
                });
                socket.on('disconnect', () => updateStatus(false));
                socket.on('users:update', (users) => { if (users && users.length > 0) allUsers = users; updateStatus(true); });
                
                // ОБЩИЙ ЧАТ
                socket.on('message:general', (data) => {
                    if (!messages['general']) messages['general'] = [];
                    messages['general'].push({
                        id: Date.now().toString(),
                        sender: data.fromPhone,
                        text: data.text,
                        time: data.time || Date.now(),
                        senderName: data.fromName || 'Пользователь',
                        senderUsername: data.fromUsername || 'user'
                    });
                    saveData();
                    if (currentChat === 'general') renderMessages();
                });

                // ЛИЧНЫЕ СООБЩЕНИЯ
                socket.on('message:private', (data) => {
                    const chatId = data.chatId;
                    if (!messages[chatId]) messages[chatId] = [];
                    messages[chatId].push({
                        id: Date.now().toString(),
                        sender: data.fromPhone,
                        text: data.text,
                        time: data.time || Date.now(),
                        senderName: data.fromName || 'Пользователь',
                        senderUsername: data.fromUsername || 'user'
                    });
                    saveData();
                    if (currentChat === chatId) renderMessages();
                    renderChatList();
                });

            } catch(e) { updateStatus(false); }
        }

        function registerOnServer() {
            if (socket && socket.connected && currentUser) {
                socket.emit('register', {
                    phone: currentUser.phone,
                    name: currentUser.name,
                    username: currentUser.username,
                    avatar: currentUser.avatar
                });
            }
        }

        function updateStatus(ok) {
            const el = document.getElementById('status');
            if (el) el.innerHTML = ok ? '<span class="online">🟢 Подключено</span>' : '<span class="offline">⚫ Локально</span>';
        }

        function saveData() {
            localStorage.setItem('kchat_msgs', JSON.stringify(messages));
            localStorage.setItem('kchat_chats', JSON.stringify(chats));
            localStorage.setItem('kchat_user', JSON.stringify(currentUser));
        }

        function loadData() {
            try {
                const m = localStorage.getItem('kchat_msgs');
                const c = localStorage.getItem('kchat_chats');
                if (m) messages = JSON.parse(m);
                if (c) chats = JSON.parse(c);
            } catch(e) {}
            if (!messages['general']) messages['general'] = [];
        }

        // ====== АВТО-ВХОД ======
        function init() {
            loadData();
            const saved = localStorage.getItem('kchat_user');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    connectServer();
                    showMain();
                    return;
                } catch(e) {}
            }
            showAuth();
        }

        function showAuth() {
            document.getElementById('app').innerHTML = `
                <h1>🚀 KChat</h1>
                <p style="text-align:center;color:#666;margin-bottom:12px">Поиск • Общий чат • Настройки</p>
                <input type="tel" id="phoneInput" placeholder="Номер телефона" value="+79001234567">
                <input type="text" id="codeInput" placeholder="Код (12345) или пароль" value="12345">
                <input type="text" id="nameInput" placeholder="Ваше имя" value="Александр">
                <input type="text" id="usernameInput" placeholder="@username" value="alex">
                <input type="password" id="passwordInput" placeholder="Пароль для входа" value="1234">
                <button onclick="login()">🚀 Войти / Зарегистрироваться</button>
                <p style="text-align:center;color:#999;font-size:12px;margin-top:8px">Код: 12345 | Готовые: alex, maria, dima, elena | Пароль: любой</p>
            `;
        }

        function login() {
            const phone = document.getElementById('phoneInput').value.trim();
            const code = document.getElementById('codeInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!phone) return alert('Введите номер');
            if (code !== '12345' && code !== password) return alert('Неверный код/пароль. Код: 12345');
            if (!name || !username) return alert('Заполните все поля');

            currentUser = { phone, name, username, avatar: '😎', status: 'В сети', password };
            saveData();
            connectServer();
            registerOnServer();
            showMain();
        }

        // ====== ГЛАВНЫЙ ЭКРАН ======
        function showMain() {
            if (!currentUser) { showAuth(); return; }

            // Создаём чат с ботом если нет
            if (!chats.find(c => c.id === 'bot_chat')) {
                chats.push({ id: 'bot_chat', type: 'private', participants: [currentUser.phone, '+79991112233'], unread: {}, pinned: false });
                messages['bot_chat'] = [{ id: Date.now().toString(), sender: '+79991112233', text: 'Привет! Я бот. Используй поиск 🔍', time: Date.now(), senderName: '🤖 Бот', senderUsername: 'bot' }];
                        saveData();
            }

            document.getElementById('app').innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                    <h2 style="margin:0;font-size:18px">💬 @${currentUser.username}</h2>
                    <span style="font-size:12px">${currentUser.name}</span>
                </div>
                <div id="status">Подключение...</div>
                <div class="tabs" id="tabs">
                    <div class="tab active" data-chat="general">🌍 Общий</div>
                    <div class="tab" data-chat="bot_chat">🤖 Бот</div>
                </div>
                <div style="font-weight:bold;margin:6px 0;font-size:14px" id="chatTitle">🌍 Общий чат</div>
                <div id="messages"></div>
                <div style="display:flex;gap:8px">
                    <input type="text" id="msgInput" placeholder="Сообщение..." style="flex:1">
                    <button onclick="sendMessage()" style="width:auto;padding:12px 20px">➤</button>
                </div>
                <div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">
                    <button onclick="showSearch()" class="green" style="width:auto;font-size:13px;padding:8px 12px">🔍 Поиск</button>
                    <button onclick="showContacts()" class="orange" style="width:auto;font-size:13px;padding:8px 12px">👥 Контакты</button>
                    <button onclick="showSettings()" class="green" style="width:auto;font-size:13px;padding:8px 12px">⚙️</button>
                    <button onclick="logout()" class="red" style="width:auto;font-size:13px;padding:8px 12px">🚪</button>
                </div>
                <div id="chatList" style="margin-top:8px"></div>
            `;

            updateStatus(socket && socket.connected);
            renderMessages();
            renderChatList();
            renderChatTabs();

            // Обработчики вкладок
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentChat = tab.dataset.chat;
                    updateChatTitle();
                    renderMessages();
                });
            });

            // Enter
            const inp = document.getElementById('msgInput');
            if (inp) inp.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        }

        function updateChatTitle() {
            const el = document.getElementById('chatTitle');
            if (!el) return;
            const titles = { 'general': '🌍 Общий чат', 'bot_chat': '🤖 Чат с ботом' };
            el.textContent = titles[currentChat] || '💬 Чат';
        }

        function renderChatTabs() {
            const container = document.getElementById('tabs');
            if (!container) return;
            const personal = chats.filter(c => c.type === 'private' && c.id !== 'bot_chat');
            personal.forEach(chat => {
                const other = chat.participants.find(p => p !== currentUser.phone);
                const user = allUsers.find(u => u.phone === other) || { name: 'Контакт' };
                const tab = document.createElement('div');
                tab.className = 'tab';
                tab.dataset.chat = chat.id;
                tab.textContent = '💬 ' + user.name.split(' ')[0];
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentChat = chat.id;
                    updateChatTitle();
                    renderMessages();
                });
                container.appendChild(tab);
            });
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const msg = {
                id: Date.now().toString(),
                sender: currentUser.phone,
                text: text,
                time: Date.now(),
                senderName: currentUser.name,
                senderUsername: currentUser.username
            };

            if (!messages[currentChat]) messages[currentChat] = [];
            messages[currentChat].push(msg);
            renderMessages();
            input.value = '';
            saveData();

            // ОТПРАВКА ЧЕРЕЗ СЕРВЕР
            if (socket && socket.connected) {
                if (currentChat === 'general') {
                    console.log('📤 Отправка в общий чат:', text);
                    socket.emit('message:general', {
                        text: text,
                        fromPhone: currentUser.phone,
                        fromName: currentUser.name,
                        fromUsername: currentUser.username
                    });
                } else {
                    const chat = chats.find(c => c.id === currentChat);
                    if (chat && chat.type === 'private') {
                        const other = chat.participants.find(p => p !== currentUser.phone);
                        if (other) {
                            console.log('📤 Отправка личного:', text, '→', other);
                            socket.emit('message:send', {
                                to: other,
                                chatId: currentChat,
                                text: text,
                                fromPhone: currentUser.phone,
                                fromName: currentUser.name,
                                fromUsername: currentUser.username
                            });
                        }
                    }
                }
            } else {
                console.log('❌ Сервер не подключен');
            }

            // Автоответ бота
            if (currentChat === 'bot_chat') {
                setTimeout(() => {
                    const replies = ['👍', 'Интересно!', 'Понял', 'Поиск 🔍'];
                    messages['bot_chat'].push({
                        id: Date.now().toString(),
                        sender: '+79991112233',
                        text: replies[Math.floor(Math.random() * replies.length)],
                        time: Date.now(),
                        senderName: '🤖 Бот',
                        senderUsername: 'bot'
                    });
                    saveData();
                    renderMessages();
                }, 1000);
            }
        }

        function renderMessages() {
            const container = document.getElementById('messages');
            if (!container) return;
            const msgs = messages[currentChat] || [];
            if (msgs.length === 0) {
                container.innerHTML = '<p style="color:#999;text-align:center;padding:20px">Нет сообщений</p>';
                return;
            }
            container.innerHTML = msgs.map(m => {
                const isMe = m.sender === currentUser.phone;
                return `<div class="msg" style="background:${isMe?'#667eea':'#f0f0f0'};color:${isMe?'white':'black'}">
                    <div class="sender" style="color:${isMe?'rgba(255,255,255,0.8)':'#667eea'}">${isMe?'Я':m.senderName||'Пользователь'} @${m.senderUsername||''}</div>
                    ${m.text}
                    <div class="time">${new Date(m.time).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})}</div>
                </div>`;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        function renderChatList() {
            const container = document.getElementById('chatList');
            if (!container) return;
            const personal = chats.filter(c => c.type === 'private' && c.id !== 'bot_chat' && c.id !== currentChat);
            if (personal.length === 0) {
                container.innerHTML = '<p style="color:#999;font-size:11px">Нет чатов. Нажмите 🔍 Поиск</p>';
                return;
            }
            container.innerHTML = '<b style="font-size:12px">Ваши чаты:</b><br>' + personal.map(c => {
                const other = c.participants.find(p => p !== currentUser.phone);
                const user = allUsers.find(u => u.phone === other) || { name: 'Контакт', username: 'user' };
                return `<button onclick="openChat('${c.id}')" style="width:auto;font-size:11px;padding:5px 8px;margin:2px">💬 ${user.name}</button>`;
            }).join(' ');
        }

        function openChat(chatId) {
            currentChat = chatId;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            showMain();
        }

        // ====== ПОИСК ======
        function showSearch() {
            const users = allUsers.length > 0 ? allUsers : [
                {phone:'+79161112233',name:'Мария',username:'maria',avatar:'👩',online:true},
                {phone:'+79262223344',name:'Дмитрий',username:'dima',avatar:'👨',online:false},
                {phone:'+79363334455',name:'Елена',username:'elena',avatar:'👩',online:true},
                {phone:'+79991112233',name:'🤖 Бот',username:'bot',avatar:'🤖',online:true}
            ];
            const available = users.filter(u => u.phone !== currentUser.phone);
            const list = available.map((u,i) => `${i+1}. ${u.name} @${u.username} ${u.online?'🟢':'⚫'}`).join('\n');
            const choice = prompt('🔍 Доступные пользователи:\n\n' + list + '\n\nВведите номер:');
            if (choice && available[parseInt(choice)-1]) {
                const user = available[parseInt(choice)-1];
                startChat(user.phone);
            }
        }

        function showContacts() {
            const users = allUsers.length > 0 ? allUsers : [
                {phone:'+79161112233',name:'Мария',username:'maria',avatar:'👩',online:true},
                {phone:'+79262223344',name:'Дмитрий',username:'dima',avatar:'👨',online:false}
            ];
            const available = users.filter(u => u.phone !== currentUser.phone);
            let html = '<div style="max-height:200px;overflow-y:auto">';
            available.forEach(u => {
                const has = chats.some(c => c.type==='private' && c.participants.includes(u.phone) && c.participants.includes(currentUser.phone));
                html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px;margin:2px 0;background:#f9f9f9;border-radius:6px">
                    <span>${u.avatar} <b>${u.name}</b> @${u.username} ${u.online?'🟢':'⚫'}</span>
                    <button onclick="startChat('${u.phone}')" style="width:auto;font-size:11px;padding:4px 8px">${has?'💬':'➕'}</button>
                </div>`;
            });
            html += '</div>';
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000';
            overlay.innerHTML = `<div style="background:white;padding:20px;border-radius:12px;width:90%;max-width:400px"><h3>👥 Контакты</h3>${html}<button onclick="this.parentElement.parentElement.remove()" style="margin-top:8px">Закрыть</button></div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()});
        }

        function startChat(phone) {
            const chatId = 'chat_' + [currentUser.phone, phone].sort().join('_');
            if (chats.some(c => c.id === chatId)) {
                currentChat = chatId;
                showMain();
                return;
            }
            const user = allUsers.find(u => u.phone === phone) || { name: 'Контакт', username: 'user' };
            chats.push({ id: chatId, type: 'private', participants: [currentUser.phone, phone], unread: {}, pinned: false });
            messages[chatId] = [{ id: Date.now().toString(), sender: currentUser.phone, text: `👋 Привет, @${user.username}!`, time: Date.now(), senderName: currentUser.name, senderUsername: currentUser.username }];
            currentChat = chatId;
            saveData();
            showMain();
        }

        // ====== НАСТРОЙКИ ======
        function showSettings() {
            const html = `
                <h3>⚙️ Настройки</h3>
                <label><input type="checkbox" id="sNotif" ${settings.notifications?'checked':''}> Уведомления</label><br>
                <label><input type="checkbox" id="sSound" ${settings.sound?'checked':''}> Звук</label><br>
                <label>Размер шрифта: <select id="sFont">
                    <option value="small" ${settings.fontSize==='small'?'selected':''}>Маленький</option>
                    <option value="medium" ${settings.fontSize==='medium'?'selected':''}>Средний</option>
                    <option value="large" ${settings.fontSize==='large'?'selected':''}>Большой</option>
                </select></label><br><br>
                <button onclick="saveSettings()">💾 Сохранить</button>
            `;
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000';
            overlay.innerHTML = `<div style="background:white;padding:20px;border-radius:12px;width:90%;max-width:400px">${html}<button onclick="this.parentElement.parentElement.remove()" style="margin-top:8px">Закрыть</button></div>`;
            document.body.appendChild(overlay);
            overlay.addEventListener('click',(e)=>{if(e.target===overlay)overlay.remove()});
        }

        function saveSettings() {
            settings.notifications = document.getElementById('sNotif')?.checked ?? true;
            settings.sound = document.getElementById('sSound')?.checked ?? true;
            settings.fontSize = document.getElementById('sFont')?.value || 'medium';
            document.body.style.fontSize = settings.fontSize === 'small' ? '13px' : settings.fontSize === 'large' ? '17px' : '15px';
            localStorage.setItem('kchat_settings', JSON.stringify(settings));
            document.querySelector('.modal-overlay')?.remove();
            alert('✅ Настройки сохранены!');
        }

        function logout() {
            if (confirm('Выйти?')) {
                currentUser = null;
                currentChat = 'general';
                localStorage.removeItem('kchat_user');
                showAuth();
            }
        }

        // ====== ЗАПУСК ======
        connectServer();
        init();
        console.log('✅ KChat готов! Общий чат работает!');
    </script>
</body>
</html>
